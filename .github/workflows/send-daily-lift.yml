name: Send Daily Lift Notifications

on:
  schedule:
    - cron: '0 13 * * *'        # 8:00 AM Eastern Time (Georgia)
  workflow_dispatch:            # Allows manual trigger

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Send Daily Notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          node - << 'EOF'
          const admin = require('firebase-admin');
          
          const serviceAccount = require('./service-account.json');
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          async function sendDailyNotifications() {
            const tokensSnapshot = await admin.firestore().collection('fcm_tokens').get();
            
            if (tokensSnapshot.empty) {
              console.log("No tokens found");
              return;
            }

            const payload = {
              notification: {
                title: "🌅 Your Daily Lift",
                body: "Time for today's wisdom, joke, or fact 💪",
                icon: "/icon-192.png"
              }
            };

            const tokens = tokensSnapshot.docs.map(doc => doc.data().token);

            const response = await admin.messaging().sendMulticast({
              tokens: tokens,
              notification: payload.notification
            });

            console.log(`✅ Sent ${response.successCount} notifications`);
          }

          sendDailyNotifications();
          EOF