name: Send Daily Lift Notifications

on:
  repository_dispatch:              # Only allow external trigger from cron-job.org
    types: [daily-notifications]
  workflow_dispatch:                # Keep manual trigger if you want it

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show current server time
        run: date -u

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install firebase-admin

      - name: Send Daily Notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sendDaily.js